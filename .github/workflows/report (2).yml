name: Update funnel report

on:
  schedule:
    - cron: "20 5,12 * * *"   # 08:20 и 15:20 МСК — после обновления поля «Последнее касание» (8:00 и 15:00)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests cryptography

      - name: Build data.json
        env:
          AMO_TOKEN: ${{ secrets.AMO_TOKEN }}
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
          REQUIRE_ENCRYPTION: "1"
        run: |
          python build_report.py
          test ! -e docs/data.json   # открытые данные не публикуем

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
